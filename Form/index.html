<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table id="userTable1" border="1">
        <tr>
            <th><h1><u>User Information Form</u>&nbsp;&nbsp;(Based on Local Storage)</h1></th>
        </tr>
    </table>
    
    <h2>Fill User Information</h2>
    <div id="form-area">
        <form id="myForm" method="get" target="_blank">
            <div class="flex-headerform">
            <label>First Name: <span class="required">*</span></label>
            <input type="text" id="fname" placeholder="First Name"required>
            </div>
            <span id="fname-error"></span>
            <br><br>

            <div class="flex-headerform">
            <label>Last Name: </label>
            <input type="text" id="lname" placeholder="Last Name">
            </div> 
            <span id="lname-error"></span>
            <br><br>
            
            <div class="flex-headerform">
            <label>Age: <span class="required">*</span></label>
            &nbsp;
            <input type="number" id="age" placeholder="Age" required>
            </div>
            <span id="age-error"></span>
            <br><br>
            
            <div class="flex-headerform">
            <label>Gender: <span class="required">*</span></label>
            <select title="Choose your Gender" id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option> 
                <option value="Other">Other</option>
            </select>
            </div>
            <span id="gender-error"></span>
            <br><br>
            <!-- <div class="flex-headerSubmit"> -->
            <button type="submit" id="submitBtn">Submit</button>
            &nbsp;
            &nbsp;
            &nbsp;
            &nbsp;
            <button type="reset">Clear</button>
            <!-- </div> -->
        </form>
    </div>

    <div id="message"></div>

    <!-- <h2 id = "h2search">Search User</h2> -->
    <!-- <div id="search-area">      
        <input type="text" id="searchBox" placeholder="Search by name">
        <button onclick="searchUser()">Search</button>
        <button onclick="showAll()">Show All</button>
    </div> -->

    <div class="flex-header">
        <h2 id = "h2data">User Data</h2>
        <div id="search-area">      
        <input type="text" id="searchBox" placeholder="Search by name">
        &nbsp;
        &nbsp;
        <button onclick="searchUser()">Search</button>
        &nbsp;
        <button onclick="showAll()">Clear</button>
        </div>
    </div>

    <div id="table-area">
        <table id="userTable" border="1">
            <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
